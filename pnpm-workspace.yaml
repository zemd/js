saveExact: true
storeDir: .pnpm-store

packages:
  - packages/*
  - http-clients/*
  - internal/*

versioning:
  changelog:
    storage: repository

catalog:
  "@types/node": 26.1.2
  fast-check: 4.9.0
  tsdown: 0.22.14
  typescript: 7.0.2
  zod: 4.4.3

# Seven days; keep aligned with Dependabot's npm cooldown.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@zemd/*"
  - hono@4.13.1
  - nanoid@3.3.17
trustPolicy: no-downgrade

overrides:
  hono@<4.12.34: ^4.12.34
  hono@>=3.8.0 <4.12.34: ^4.12.34
  hono@>=4.12.0 <4.12.34: ^4.12.34
  hono@>=4.7.0 <4.12.34: ^4.12.34
  nanoid@<3.3.17: ^3.3.17

saveExact: true

packages:
  - packages/*
  - http-clients/*

# Release management is handled by pnpm itself:
#   pnpm change      -> record a change intent in .changeset/
#   pnpm version -r  -> apply intents, bump versions, write changelogs
#   pnpm publish -r  -> publish everything not yet on the registry
# https://pnpm.io/versioning
versioning:
  changelog:
    storage: repository

catalog:
  tsdown: 0.22.14
  typescript: 7.0.2
  vitest: 4.1.10
  zod: 4.4.3

minimumReleaseAgeExclude:
  - "@zemd/*"

allowBuilds:
  "@swc/core": false

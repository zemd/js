saveExact: true

packages:
  - packages/*
  - http-clients/*
  - internal/*

versioning:
  changelog:
    storage: repository

catalog:
  "@types/node": 26.1.2
  fast-check: 4.9.0
  tsdown: 0.22.14
  typescript: 7.0.2
  vitest: 4.1.10
  zod: 4.4.3

# Seven days; keep aligned with Dependabot's npm cooldown.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@zemd/*"

allowBuilds:
  "@swc/core": false

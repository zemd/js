name: CI

permissions: {}

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/shared-ci.yml
    permissions:
      contents: read
    with:
      playwright-filter: "@zemd/std-modules"

  shared-version:
    name: Shared workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # .github/scripts is committed build output, so a stale copy would ship
      # different behaviour than internal/gha/src describes.
      - name: Check the committed tooling matches its source
        run: |
          pnpm --filter @zemd/gha run build
          pnpm --filter @zemd/gha run sync-check

      # Consumers pin `shared-*.yml` by SHA, so a behaviour change that skips the
      # version bump would never reach them through the moving `vX` tag.
      - name: Require a release intent when the shared contract changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "pull request SHAs unavailable; skipping shared contract check"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            '.github/workflows/shared-*.yml' .github/scripts)"
          if [ -z "$changed" ]; then
            echo "shared contract untouched"
            exit 0
          fi
          changesets=()
          while IFS= read -r -d '' changeset; do
            changesets+=("$changeset")
          done < <(
            git diff --name-only --diff-filter=AM -z "$BASE_SHA...$HEAD_SHA" -- \
              '.changeset/*.md'
          )

          missing_release_intent() {
            echo "::error::Add a change intent for @zemd/gha, these shared files changed:"
            printf '%s\n' "$changed"
            exit 1
          }
          if [ "${#changesets[@]}" -eq 0 ]; then
            missing_release_intent
          fi

          # Keep this in sync with internal/gha/src/contract-version.ts: only an
          # exact package key and a supported bump in frontmatter count as intent.
          if ! node --input-type=module - "${changesets[@]}" <<'NODE'
          import { readFileSync } from "node:fs";

          const scalar = (value) => {
            const trimmed = value.trim();
            const quote = trimmed.at(0);
            return (quote === '"' || quote === "'") && trimmed.at(-1) === quote
              ? trimmed.slice(1, -1)
              : trimmed;
          };
          const hasReleaseIntent = (source) => {
            const body = source.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/)?.[1] ?? "";
            for (const line of body.split(/\r?\n/)) {
              const separator = line.indexOf(":");
              if (separator < 0 || scalar(line.slice(0, separator)) !== "@zemd/gha") continue;
              if (/^(?:major|minor|patch)$/.test(scalar(line.slice(separator + 1)))) return true;
            }
            return false;
          };

          if (!process.argv.slice(2).some((path) => hasReleaseIntent(readFileSync(path, "utf8")))) {
            process.exitCode = 1;
          }
          NODE
          then
            missing_release_intent
          fi
          echo "release intent recorded alongside:"
          printf '%s\n' "$changed"

name: Benchmarks

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, edited, synchronize]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks
    # Run benchmarks once the Bencher project is configured, even if publishing
    # is disabled by a missing API key. Never run caller code from a fork.
    if: vars.BENCHER_PROJECT != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/shared-benchmarks.yml
    permissions:
      contents: read # checkout the repository for benchmarks
      checks: write # used only by the isolated Bencher publishing job
      pull-requests: write # used only by the isolated Bencher publishing job
    with:
      project: ${{ vars.BENCHER_PROJECT }}
    secrets:
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}

name: Benchmarks

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, edited, synchronize]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks
    # Keep the workflow dormant until the Bencher project and key are configured,
    # and never expose the key to code from a fork.
    if: vars.BENCHER_PROJECT != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/shared-benchmarks.yml
    permissions:
      contents: read # checkout the repository for benchmarks
      checks: write # publish the Bencher report as a GitHub Check
      pull-requests: write # publish the report on same-repository pull requests
    with:
      project: ${{ vars.BENCHER_PROJECT }}
    secrets:
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}

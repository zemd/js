name: Shared Scorecard

# Shared OpenSSF Scorecard analysis.
# Call it from a repository with:
#   uses: zemd/js/.github/workflows/shared-scorecard.yml@<sha> # v4

permissions: {}

on:
  workflow_call:
    inputs:
      publish-results:
        description: Publish the result to the OpenSSF REST API so the badge stays current.
        type: boolean
        default: true
      artifact-retention-days:
        description: How long the raw SARIF artifact is kept.
        type: number
        default: 5

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout the caller repository for analysis
      actions: read # inspect workflow runs for dangerous patterns
      security-events: write # upload results to code scanning
      id-token: write # publish results to the OpenSSF REST API

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif

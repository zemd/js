name: Shared Scorecard

# Shared OpenSSF Scorecard analysis.
# Call it from a repository with:
#   uses: zemd/js/.github/workflows/shared-scorecard.yml@<sha> # v4

permissions: {}

on:
  workflow_call:
    inputs:
      publish-results:
        description: Publish the result to the OpenSSF REST API so the badge stays current.
        type: boolean
        default: true
      artifact-retention-days:
        description: How long the raw SARIF artifact is kept.
        type: number
        default: 5

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout the caller repository for analysis
      actions: read # inspect workflow runs for dangerous patterns
      security-events: write # upload results to code scanning
      id-token: write # publish results to the OpenSSF REST API

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

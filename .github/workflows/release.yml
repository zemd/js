name: Release

permissions: {}

on:
  push:
    branches:
      - main

# A release must finish once started; serialize runs without cancelling one that
# may already be publishing packages or moving tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: ./.github/workflows/shared-release.yml
    permissions:
      contents: write # release branch, git tags and GitHub releases
      pull-requests: write # open and refresh the release pull request
      id-token: write # npm trusted publishing (OIDC)
    with:
      shared-tooling-repository: ${{ github.repository }}
      shared-tooling-ref: ${{ github.sha }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publishes the `shared-*.yml` contract itself: a `vX.Y.Z` tag, a moving `vX`
  # tag and a release whose body carries SHA-pinned `uses:` lines to copy.
  shared-workflows:
    name: Publish shared workflows
    needs: release
    if: needs.release.outputs.pending == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the shared workflow tags and GitHub release

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag and release the shared workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/gha.mjs shared-workflows-release internal/gha/package.json .github/workflows

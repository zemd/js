name: Release

permissions: {}

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # https://consoledonottrack.com - opts out of Turborepo and other CLI telemetry
  DO_NOT_TRACK: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.version.outputs.pending }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Snapshot current versions
        run: pnpm list -r --depth -1 --json > "${RUNNER_TEMP}/versions-before.json"

      # Consumes the change intents in .changeset/, bumps every affected package
      # and its workspace dependents, and writes the changelog entries.
      - name: Apply pending release intents
        id: version
        run: |
          pnpm version -r
          pnpm install --lockfile-only
          if [ -n "$(git status --porcelain)" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render release pull request body
        if: steps.version.outputs.pending == 'true'
        run: |
          pnpm list -r --depth -1 --json > "${RUNNER_TEMP}/versions-after.json"
          node .github/scripts/release-pr-body.mjs \
            "${RUNNER_TEMP}/versions-before.json" \
            "${RUNNER_TEMP}/versions-after.json" > "${RUNNER_TEMP}/pr-body.md"
          cat "${RUNNER_TEMP}/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open release pull request
        if: steps.version.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C release/main
          git add -A
          git commit -m "chore(release): version packages"
          git push --force origin release/main
          pr="$(gh pr list --head release/main --base main --state open --json number --jq '.[].number')"
          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head release/main \
              --title "chore(release): version packages" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
          else
            gh pr edit "$pr" --body-file "${RUNNER_TEMP}/pr-body.md"
          fi

  # No intents were pending, so main already holds the released versions.
  # `pnpm publish -r` skips anything the registry already serves.
  publish:
    name: Publish
    needs: version
    if: needs.version.outputs.pending == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm run build

      - name: Validate publishable packages
        run: pnpm run lint-publish

      - name: Publish to npm
        run: pnpm publish -r --access public --no-git-checks

name: Release

permissions: {}

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    uses: ./.github/workflows/shared-release.yml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publishes the `shared-*.yml` contract itself: a `vX.Y.Z` tag, a moving `vX`
  # tag and a release whose body carries SHA-pinned `uses:` lines to copy.
  shared-workflows:
    name: Publish shared workflows
    needs: release
    if: needs.release.outputs.pending == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag and release the shared workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/gha.mjs shared-workflows-release internal/gha/package.json .github/workflows

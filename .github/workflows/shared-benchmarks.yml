name: Shared Benchmarks

# Continuous benchmark history with Bencher. Call it from a repository whose
# fixed `test-bench` script writes Bencher Metric Format JSON files directly to
# the directory provided in BENCHER_OUTPUT_DIR.
#   uses: zemd/js/.github/workflows/shared-benchmarks.yml@<sha> # v4

permissions: {}

on:
  workflow_call:
    inputs:
      project:
        description: Existing Bencher project slug or UUID.
        type: string
        required: true
      error-on-alert:
        description: Fail the job when a configured Bencher threshold raises an alert.
        type: boolean
        default: false
    secrets:
      BENCHER_API_KEY:
        description: Optional project-scoped Bencher API key used to submit benchmark reports. Publishing is skipped when absent.
        required: false

# Not inherited from the caller: `env` defined at the caller's workflow level is
# never propagated into a reusable workflow.
env:
  # https://consoledonottrack.com - opts out of Turborepo and other CLI telemetry
  DO_NOT_TRACK: 1

jobs:
  benchmarks:
    name: Run benchmarks
    # Repository secrets are unavailable to pull requests from forks. Skipping
    # those runs also avoids publishing unreviewed fork results to Bencher.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout the caller repository

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run benchmarks
        env:
          BENCHER_OUTPUT_DIR: ${{ runner.temp }}/bencher-results
        run: pnpm run test-bench

      - name: Combine benchmark results
        env:
          BENCHER_OUTPUT_DIR: ${{ runner.temp }}/bencher-results
          BENCHER_RESULTS_FILE: ${{ runner.temp }}/bencher-results.json
        run: |
          node --input-type=module - "$BENCHER_OUTPUT_DIR" "$BENCHER_RESULTS_FILE" <<'NODE'
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const [directory, output] = process.argv.slice(2);
          if (!directory || !output) throw new Error("benchmark result paths are required");

          const files = (await readdir(directory)).filter((file) => file.endsWith(".json")).sort();
          if (files.length === 0) throw new Error("test-bench did not write any Bencher JSON files");

          const entries = [];
          const benchmarkNames = new Set();
          for (const file of files) {
            const metrics = JSON.parse(await readFile(join(directory, file), "utf8"));
            if (metrics === null || typeof metrics !== "object" || Array.isArray(metrics)) {
              throw new TypeError(`${file} must contain a Bencher Metric Format object`);
            }
            for (const [name, measures] of Object.entries(metrics)) {
              if (benchmarkNames.has(name)) throw new Error(`duplicate Bencher benchmark: ${name}`);
              benchmarkNames.add(name);
              entries.push([name, measures]);
            }
          }

          await writeFile(output, `${JSON.stringify(Object.fromEntries(entries))}\n`);
          NODE

      # The artifact is the only state that crosses into the credentialed job.
      # It is immutable after upload and is validated again before publication.
      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bencher-results
          path: ${{ runner.temp }}/bencher-results.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish benchmarks
    needs: benchmarks
    # Keep the credentialed boundary unavailable to fork pull requests even if
    # a caller accidentally removes its matching guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write # publish the Bencher report as a GitHub Check
      pull-requests: write # publish the report on same-repository pull requests

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bencher-results
          path: ${{ runner.temp }}/bencher-artifact

      # Treat the artifact as untrusted data. The publishing runner never checks
      # out or executes caller code and only forwards a bounded, canonical BMF file.
      - name: Validate benchmark results
        env:
          BENCHER_ARTIFACT_DIR: ${{ runner.temp }}/bencher-artifact
          BENCHER_RESULTS_FILE: ${{ runner.temp }}/bencher-results-validated.json
        run: |
          node --input-type=module - "$BENCHER_ARTIFACT_DIR" "$BENCHER_RESULTS_FILE" <<'NODE'
          import { lstat, readFile, readdir, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const [directory, output] = process.argv.slice(2);
          if (!directory || !output) throw new Error("benchmark artifact paths are required");

          const artifactName = "bencher-results.json";
          const entries = await readdir(directory, { withFileTypes: true });
          if (
            entries.length !== 1 ||
            entries[0]?.name !== artifactName ||
            !entries[0].isFile()
          ) {
            throw new Error(`benchmark artifact must contain only ${artifactName}`);
          }

          const input = join(directory, artifactName);
          const stats = await lstat(input);
          const maxBytes = 1024 * 1024;
          if (!stats.isFile() || stats.size === 0 || stats.size > maxBytes) {
            throw new Error(`benchmark artifact must be a non-empty file of at most ${maxBytes} bytes`);
          }

          const parsed = JSON.parse(await readFile(input, "utf8"));
          const isRecord = (value) =>
            value !== null && typeof value === "object" && !Array.isArray(value);
          if (!isRecord(parsed)) throw new TypeError("benchmark artifact must contain a BMF object");

          const benchmarks = Object.entries(parsed);
          if (benchmarks.length === 0 || benchmarks.length > 1000) {
            throw new Error("benchmark artifact must contain between 1 and 1000 benchmarks");
          }

          const allowedMetricFields = new Set(["value", "lower_value", "upper_value"]);
          const canonical = Object.create(null);
          let metricCount = 0;
          for (const [benchmark, measures] of benchmarks) {
            if (benchmark.length === 0 || benchmark.length > 1024 || !isRecord(measures)) {
              throw new TypeError(`invalid benchmark entry: ${benchmark}`);
            }

            const measureEntries = Object.entries(measures);
            if (measureEntries.length === 0) {
              throw new Error(`benchmark must contain at least one measure: ${benchmark}`);
            }

            const canonicalMeasures = Object.create(null);
            for (const [measure, metric] of measureEntries) {
              metricCount += 1;
              if (metricCount > 10_000) throw new Error("benchmark artifact has too many metrics");
              if (measure.length === 0 || measure.length > 64 || !isRecord(metric)) {
                throw new TypeError(`invalid measure entry: ${benchmark}/${measure}`);
              }

              const fields = Object.keys(metric);
              if (
                !Object.hasOwn(metric, "value") ||
                fields.some((field) => !allowedMetricFields.has(field))
              ) {
                throw new TypeError(`invalid metric fields: ${benchmark}/${measure}`);
              }

              const canonicalMetric = Object.create(null);
              for (const field of fields) {
                const value = metric[field];
                if (typeof value !== "number" || !Number.isFinite(value)) {
                  throw new TypeError(`metric values must be finite numbers: ${benchmark}/${measure}`);
                }
                canonicalMetric[field] = value;
              }
              canonicalMeasures[measure] = canonicalMetric;
            }
            canonical[benchmark] = canonicalMeasures;
          }

          await writeFile(output, `${JSON.stringify(canonical)}\n`, { flag: "wx" });
          NODE

      # Do not expose the secret until the caller-produced artifact is validated.
      - name: Check benchmark publishing configuration
        id: publishing
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          if [ -z "$BENCHER_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping benchmark publishing because BENCHER_API_KEY is not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bencher
        if: steps.publishing.outputs.enabled == 'true'
        uses: bencherdev/bencher@4c83b25441d145ee273adaf74be30f2382e6ba85 # v0.6.11
        with:
          version: "0.6.11"

      # A non-empty but invalid key reaches Bencher so authentication failures
      # still fail the workflow.
      - name: Track benchmarks with Bencher
        if: steps.publishing.outputs.enabled == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_BRANCH: ${{ github.head_ref || github.ref_name }}
          BENCHER_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCHER_PROJECT: ${{ inputs.project }}
          BENCHER_RESULTS_FILE: ${{ runner.temp }}/bencher-results-validated.json
          BENCHER_START_POINT: ${{ github.base_ref }}
          BENCHER_START_POINT_HASH: ${{ github.event.pull_request.base.sha }}
          ERROR_ON_ALERT: ${{ inputs.error-on-alert }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BENCHER_PROJECT" ]; then
            echo "::error::The Bencher project input must not be empty."
            exit 1
          fi

          arguments=(
            --project "$BENCHER_PROJECT"
            --branch "$BENCHER_BRANCH"
            --hash "$BENCHER_HASH"
            --testbed ubuntu-latest
            --adapter json
            --file "$BENCHER_RESULTS_FILE"
            --github-actions "$GITHUB_TOKEN"
            --ci-id benchmarks
          )

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            arguments+=(
              --start-point "$BENCHER_START_POINT"
              --start-point-hash "$BENCHER_START_POINT_HASH"
              --start-point-clone-thresholds
              --start-point-reset
            )
          fi
          if [ "$ERROR_ON_ALERT" = "true" ]; then
            arguments+=(--error-on-alert)
          fi

          bencher run "${arguments[@]}"

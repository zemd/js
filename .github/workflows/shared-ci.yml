name: Shared CI

# Shared pull request pipeline for the pnpm + turbo monorepos.
# Call it from a repository with:
#   uses: zemd/js/.github/workflows/shared-ci.yml@<sha> # v2
# See .github/workflows-examples/ for ready-to-copy caller workflows.

permissions: {}

on:
  workflow_call:
    inputs:
      os-matrix:
        description: JSON array of runner labels for the build & test matrix.
        type: string
        # possible acceptable values: '["ubuntu-latest", "macos-latest", "windows-latest"]'
        default: '["ubuntu-latest"]'
      playwright-filter:
        description: pnpm --filter selector for the package that owns Playwright. Empty skips browser tests.
        type: string
        default: ""
      report-change-intents:
        description: Report pending `pnpm change` release intents in the job log.
        type: boolean
        default: true
      dependency-review-severity:
        description: Lowest advisory severity that fails the dependency review.
        type: string
        default: "high"
      dependency-review-scopes:
        description: Dependency scopes the review applies to.
        type: string
        default: "runtime, development, unknown"

# Not inherited from the caller: `env` defined at the caller's workflow level is
# never propagated into a reusable workflow.
env:
  # https://consoledonottrack.com - opts out of Turborepo and other CLI telemetry
  DO_NOT_TRACK: 1

# Windows runners default to pwsh, where `$VAR` is not an environment variable.
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm run lint-check

      - name: Check formatting
        run: pnpm run format-check

      - name: Report pending release intents
        if: inputs.report-change-intents
        run: pnpm change status

  test:
    name: "Build & Test: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run tests
        if: runner.os != 'Linux'
        run: pnpm run test

      - name: Run tests with native coverage
        if: runner.os == 'Linux'
        run: pnpm run test-coverage

      - name: Upload native coverage reports
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-node-coverage-${{ matrix.os }}
          path: "**/coverage.lcov"
          if-no-files-found: error
          retention-days: 14

      - name: Validate publishable packages
        run: pnpm run lint-publish

  browser:
    name: Browser Tests
    if: inputs.playwright-filter != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      PLAYWRIGHT_FILTER: ${{ inputs.playwright-filter }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter "$PLAYWRIGHT_FILTER" exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter "$PLAYWRIGHT_FILTER" exec playwright install --with-deps chromium

      # Cached browser binaries still need the OS-level libraries they link against.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter "$PLAYWRIGHT_FILTER" exec playwright install-deps chromium

      - name: Run browser tests
        run: pnpm run test-browser

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency-review-severity }}
          fail-on-scopes: ${{ inputs.dependency-review-scopes }}

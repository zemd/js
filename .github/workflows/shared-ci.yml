name: Shared CI

# Shared pull request pipeline for the pnpm + turbo monorepos.
# Call it from a repository with:
#   uses: zemd/js/.github/workflows/shared-ci.yml@<sha> # v1
# See .github/workflows-examples/ for ready-to-copy caller workflows.

permissions: {}

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version passed to actions/setup-node.
        type: string
        default: "lts/*"
      os-matrix:
        description: JSON array of runner labels for the build & test matrix.
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      lint-script:
        description: package.json script that lints. Empty skips the step.
        type: string
        default: "lint-check"
      format-script:
        description: package.json script that checks formatting. Empty skips the step.
        type: string
        default: "format-check"
      typecheck-script:
        description: package.json script that typechecks. Empty skips the step.
        type: string
        default: "typecheck"
      build-script:
        description: package.json script that builds. Empty skips the step.
        type: string
        default: "build"
      test-script:
        description: package.json script that runs the test suite. Empty skips the step.
        type: string
        default: "test"
      publint-script:
        description: package.json script that validates publishable packages. Empty skips the step.
        type: string
        default: "lint-publish"
      browser-test-script:
        description: package.json script that runs Playwright tests. Empty skips the whole job.
        type: string
        default: ""
      playwright-filter:
        description: pnpm --filter selector for the package that owns the Playwright dependency.
        type: string
        default: ""
      report-change-intents:
        description: Report pending `pnpm change` release intents in the job log.
        type: boolean
        default: true
      dependency-review:
        description: Run actions/dependency-review-action on pull requests.
        type: boolean
        default: true
      dependency-review-severity:
        description: Lowest advisory severity that fails the dependency review.
        type: string
        default: "high"
      dependency-review-scopes:
        description: Dependency scopes the review applies to.
        type: string
        default: "runtime, development, unknown"

# Not inherited from the caller: `env` defined at the caller's workflow level is
# never propagated into a reusable workflow.
env:
  # https://consoledonottrack.com - opts out of Turborepo and other CLI telemetry
  DO_NOT_TRACK: 1

# Windows runners default to pwsh, where `$VAR` is not an environment variable.
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        if: inputs.lint-script != ''
        env:
          SCRIPT: ${{ inputs.lint-script }}
        run: pnpm run "$SCRIPT"

      - name: Check formatting
        if: inputs.format-script != ''
        env:
          SCRIPT: ${{ inputs.format-script }}
        run: pnpm run "$SCRIPT"

      - name: Report pending release intents
        if: inputs.report-change-intents
        run: pnpm change status

  test:
    name: "Build & Test: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        if: inputs.typecheck-script != ''
        env:
          SCRIPT: ${{ inputs.typecheck-script }}
        run: pnpm run "$SCRIPT"

      - name: Build
        if: inputs.build-script != ''
        env:
          SCRIPT: ${{ inputs.build-script }}
        run: pnpm run "$SCRIPT"

      - name: Run tests
        if: inputs.test-script != ''
        env:
          SCRIPT: ${{ inputs.test-script }}
        run: pnpm run "$SCRIPT"

      - name: Validate publishable packages
        if: inputs.publint-script != ''
        env:
          SCRIPT: ${{ inputs.publint-script }}
        run: pnpm run "$SCRIPT"

  browser:
    name: Browser Tests
    if: inputs.browser-test-script != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PLAYWRIGHT_FILTER: ${{ inputs.playwright-filter }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter "$PLAYWRIGHT_FILTER" exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter "$PLAYWRIGHT_FILTER" exec playwright install --with-deps chromium

      # Cached browser binaries still need the OS-level libraries they link against.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter "$PLAYWRIGHT_FILTER" exec playwright install-deps chromium

      - name: Run browser tests
        env:
          SCRIPT: ${{ inputs.browser-test-script }}
        run: pnpm run "$SCRIPT"

  dependency-review:
    name: Dependency Review
    if: inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency-review-severity }}
          fail-on-scopes: ${{ inputs.dependency-review-scopes }}

name: Release

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"

# A release must finish once started; serialize runs without cancelling one that
# may already be publishing packages or moving tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: ./.github/workflows/shared-release.yml
    permissions:
      contents: read # check release state and pinned tooling
      id-token: write # npm trusted publishing (OIDC)
    with:
      release-branchkeeper-client-id: ${{ vars.RELEASE_BRANCHKEEPER_CLIENT_ID }}
      release-publisher-client-id: ${{ vars.RELEASE_PUBLISHER_CLIENT_ID }}
      # Validate pnpm's bump for this private, unpublished contract package.
      contract-version-package: internal/gha/package.json
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_BRANCHKEEPER_PRIVATE_KEY: ${{ secrets.RELEASE_BRANCHKEEPER_PRIVATE_KEY }}
      RELEASE_PUBLISHER_PRIVATE_KEY: ${{ secrets.RELEASE_PUBLISHER_PRIVATE_KEY }}
  # Publishes the `shared-*.yml` contract itself: a `vX.Y.Z` tag, a moving `vX`
  # tag and a release whose body carries SHA-pinned `uses:` lines to copy.
  shared-workflows:
    name: Publish shared workflows
    needs: release
    if: needs.release.outputs.pending == 'false' && needs.release.outputs.contract-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the protected main branch

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Release Publisher token
        id: release-publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write

      - name: Tag and release the shared workflows
        env:
          GITHUB_TOKEN: ${{ steps.release-publisher-token.outputs.token }}
        run: |
          node .github/scripts/gha.mjs shared-workflows-release internal/gha/package.json .github/workflows

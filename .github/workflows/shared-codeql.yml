name: Shared CodeQL

# Shared CodeQL analysis.
# Call it from a repository with:
#   uses: zemd/js/.github/workflows/shared-codeql.yml@<sha> # v1

permissions: {}

on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages to analyze.
        type: string
        default: '["actions", "javascript-typescript"]'

jobs:
  analyze:
    name: "Analyze: ${{ matrix.language }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          # Interpreted languages need no compilation step.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{ matrix.language }}"

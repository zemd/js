name: Shared CodeQL

# Shared CodeQL analysis.
# Call it from a repository with:
#   uses: zemd/js/.github/workflows/shared-codeql.yml@<sha> # v4

permissions: {}

on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages to analyze.
        type: string
        default: '["actions", "javascript-typescript"]'

jobs:
  analyze:
    name: "Analyze: ${{ matrix.language }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout the caller repository for analysis
      actions: read # let CodeQL read workflow-run metadata
      security-events: write # upload results to code scanning

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Interpreted languages need no compilation step.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

name: Shared CodeQL

# Shared CodeQL analysis.
# Call it from a repository with:
#   uses: zemd/js/.github/workflows/shared-codeql.yml@<sha> # v3

permissions: {}

on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages to analyze.
        type: string
        default: '["actions", "javascript-typescript"]'

jobs:
  analyze:
    name: "Analyze: ${{ matrix.language }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout the caller repository for analysis
      actions: read # let CodeQL read workflow-run metadata
      security-events: write # upload results to code scanning

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # Interpreted languages need no compilation step.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"

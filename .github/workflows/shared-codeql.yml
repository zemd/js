name: Shared CodeQL

# Shared CodeQL analysis.
# Call it from a repository with:
#   uses: zemd/js/.github/workflows/shared-codeql.yml@<sha> # v4

permissions: {}

on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages to analyze.
        type: string
        default: '["actions", "javascript-typescript"]'

jobs:
  analyze:
    name: "Analyze: ${{ matrix.language }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout the caller repository for analysis
      actions: read # let CodeQL read workflow-run metadata
      security-events: write # upload results to code scanning

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # Interpreted languages need no compilation step.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

version: 2
updates:
  - package-ecosystem: "npm"
    directories: # Every workspace project plus the root manifest
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    # Match pnpm's release-age policy for npm packages.
    cooldown:
      default-days: 7 # pnpm-workspace.yaml: minimumReleaseAge / 1440
      # Keep exemptions aligned with pnpm-workspace.yaml.
      exclude:
        - "@zemd/*"
    versioning-strategy: "increase" # the workspace pins exact versions (saveExact)
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  # Also keeps the `zemd/js/.github/workflows/shared-*.yml@<sha>` pins current,
  # rewriting both the SHA and the `# v3` comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

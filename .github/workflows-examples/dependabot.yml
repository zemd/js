version: 2
updates:
  - package-ecosystem: "npm"
    directories: # Every workspace project plus the root manifest
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase" # the workspace pins exact versions (saveExact)
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  # Also keeps the `zemd/js/.github/workflows/shared-*.yml@<sha>` pins current,
  # rewriting both the SHA and the `# v1` comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

name: CodeQL

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Catches advisories published after the last commit.
    - cron: "24 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    uses: zemd/js/.github/workflows/shared-codeql.yml@__SHA__ # v1
    permissions:
      contents: read
      actions: read
      security-events: write
    # with:
    #   languages: '["actions", "javascript-typescript"]'

name: Benchmarks

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, edited, synchronize]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks
    # BENCHER_PROJECT enables benchmark runs. BENCHER_API_KEY is optional; when
    # absent, results are generated but publishing is skipped. Forks stay excluded.
    if: vars.BENCHER_PROJECT != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: zemd/js/.github/workflows/shared-benchmarks.yml@__SHA__ # v4
    permissions:
      contents: read # checkout the repository for benchmarks
      checks: write # used only by the isolated Bencher publishing job
      pull-requests: write # used only by the isolated Bencher publishing job
    with:
      project: ${{ vars.BENCHER_PROJECT }}
      # Keep reports informational until the project has stable thresholds.
      # error-on-alert: false
    secrets:
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}

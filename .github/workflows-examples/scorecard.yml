name: Scorecard

permissions: {}

on:
  push:
    branches:
      - main
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard
    uses: zemd/js/.github/workflows/shared-scorecard.yml@__SHA__ # v1
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    # with:
    #   publish-results: true
    #   artifact-retention-days: 5

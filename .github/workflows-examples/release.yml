# Keep this file named `release.yml`: npm trusted publishing validates the
# *calling* workflow filename, not the reusable workflow that submits packages.
name: Release

permissions: {}

on:
  push:
    branches:
      - main

# A release must finish once started; serialize runs without cancelling one that
# may already be publishing packages or moving tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: zemd/js/.github/workflows/shared-release.yml@__SHA__ # v1
    permissions:
      contents: write # release branch, git tags and GitHub releases
      pull-requests: write # open and refresh the release pull request
      id-token: write # npm trusted publishing (OIDC)
    with:
      # Keep this SHA equal to the one in `uses` above.
      shared-tooling-repository: zemd/js
      shared-tooling-ref: __SHA__
      # node-version: "lts/*"
      # base-branch: main
      # release-branch: release/main
      # release-title: "chore(release): version packages"
      # contract-version-package: "" # Private workflow/tooling contract, if any.
      # build-script: build
      # publint-script: lint-publish
      # staged-publishing: true # Set false when every release should publish directly.
      # registry-url: "https://registry.npmjs.org"
    secrets:
      # Optional after every package exists. First releases automatically use
      # regular publishing and require this repository secret.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
